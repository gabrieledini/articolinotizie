<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0066cc">
<title>Ascolta le notizie</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-italia@2.18.3/dist/css/bootstrap-italia.min.css">
<script>window.__PUBLIC_PATH__ = "https://cdn.jsdelivr.net/npm/bootstrap-italia@2.18.3/dist/fonts";</script>
<style>
  [hidden] { display: none !important; }
  body { padding-bottom: env(safe-area-inset-bottom, 0px); background: #f5f7fa; }
  .it-header-slim-wrapper { padding-top: env(safe-area-inset-top, 0px); }
  .it-header-center-wrapper { height: auto; padding: 20px 0; }
  .it-brand-title { font-size: 1.75rem; }

  .scelta { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .scelta .btn { min-width: 150px; }

  /* Lettore fisso in basso */
  .lettore {
    position: sticky; bottom: 0; z-index: 5; background: #fff;
    box-shadow: 0 -2px 8px rgba(0,0,0,.08);
    padding: 12px 0 calc(84px + env(safe-area-inset-bottom, 0px));
  }
  .comandi { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .comandi .btn { min-width: 64px; }
  .ora-legge { font-size: .875rem; color: #5d7083; text-align: center; margin-bottom: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .voce { cursor: pointer; border-left: 4px solid transparent; }
  .voce.attiva { border-left-color: #0066cc; background: #e6f0fa; }
  .voce .fonte { font-size: .75rem; font-weight: 600; text-transform: uppercase; color: #0066cc; }
  .voce .quando { font-size: .75rem; color: #5d7083; margin-left: 6px; }
</style>
</head>
<body>
<header class="it-header-wrapper">
  <div class="it-header-slim-wrapper">
    <div class="container">
      <div class="it-header-slim-wrapper-content">
        <a class="d-lg-block navbar-brand" href="index.html">‹ Notizie</a>
      </div>
    </div>
  </div>
  <div class="it-nav-wrapper">
    <div class="it-header-center-wrapper">
      <div class="container">
        <div class="it-brand-wrapper">
          <div class="it-brand-text">
            <div class="it-brand-title">Ascolta</div>
            <div class="it-brand-tagline d-none d-md-block">Le ultime notizie lette ad alta voce</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="container py-4">
  <div class="scelta mb-4" role="group" aria-label="Quali notizie ascoltare">
    <button type="button" class="btn btn-outline-primary" data-gruppo="viareggio">Viareggio</button>
    <button type="button" class="btn btn-outline-primary" data-gruppo="altre">Altre notizie</button>
  </div>

  <div class="alert alert-warning" role="alert" id="errori" hidden></div>
  <p class="text-center text-secondary" id="stato" aria-live="polite">Scegli quali notizie ascoltare.</p>
  <div class="list-group" id="lista"></div>
</main>

<div class="lettore">
  <div class="container">
    <div class="ora-legge" id="oraLegge">&nbsp;</div>
    <div class="comandi">
      <button type="button" class="btn btn-outline-primary btn-sm" id="prec" aria-label="Notizia precedente">⏮</button>
      <button type="button" class="btn btn-primary btn-sm" id="play" disabled>Ascolta</button>
      <button type="button" class="btn btn-outline-primary btn-sm" id="succ" aria-label="Notizia successiva">⏭</button>
      <button type="button" class="btn btn-outline-danger btn-sm" id="stop">Ferma</button>
    </div>
  </div>
</div>

<script>
const GRUPPI = {
  viareggio: {
    nome: "Viareggio",
    fonti: { nazione_vg: "La Nazione Viareggio", tirreno_vg: "Il Tirreno Versilia", versiliatoday: "Versilia Today" },
  },
  altre: {
    nome: "Altre notizie",
    fonti: { open: "Open", internazionale: "Internazionale", ansa: "ANSA", adnkronos: "Adnkronos" },
  },
};
const PROXY = "/.netlify/functions/feed?src=";
const MAX_NOTIZIE = 25;
const $ = (id) => document.getElementById(id);
const synth = window.speechSynthesis;

let gruppo = null;
let notizie = [];
let indice = 0;
let stato = "fermo"; // fermo | legge | pausa
let wakeLock = null;

// ---------- Preferenze ----------
const pref = (() => { try { return JSON.parse(localStorage.getItem("ascolta") || "{}"); } catch { return {}; } })();
const salva = () => { try { localStorage.setItem("ascolta", JSON.stringify(pref)); } catch {} };


// ---------- Voce ----------
const VELOCITA = 1.3;
let voceScelta = null;
function scegliVoce() {
  const it = synth.getVoices().filter((v) => v.lang.toLowerCase().startsWith("it"));
  voceScelta = it.find((v) => /google/i.test(v.name)) || it.find((v) => v.localService) || it[0] || null;
}
scegliVoce();
synth.addEventListener?.("voiceschanged", scegliVoce);

// ---------- Feed ----------
function testoPulito(html) {
  if (!html) return "";
  const doc = new DOMParser().parseFromString(html, "text/html");
  return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
}
function primo(el, ...nomi) {
  for (const n of nomi) { const x = el.getElementsByTagName(n)[0]; if (x) return x; }
  return null;
}
function parseFeed(xmlText, src, nome) {
  const xml = new DOMParser().parseFromString(xmlText, "application/xml");
  if (xml.getElementsByTagName("parsererror").length) throw new Error("XML non valido");
  const items = [...xml.getElementsByTagName("item"), ...xml.getElementsByTagName("entry")];
  return items.slice(0, 40).map((it) => {
    const titolo = testoPulito(primo(it, "title")?.textContent)
      .replace(/\s+-\s+(La Nazione|Il Tirreno|Versilia Today)$/i, "");
    const linkEl = primo(it, "link");
    const link = linkEl?.getAttribute("href") || linkEl?.textContent?.trim() || "";
    const dataTxt = primo(it, "pubDate", "dc:date", "published", "updated")?.textContent;
    const data = dataTxt ? new Date(dataTxt) : null;
    const desc = testoPulito(primo(it, "description", "summary", "content")?.textContent);
    return {
      src, fonte: nome, titolo, link,
      ts: data && !isNaN(data) ? data.getTime() : 0,
      desc: desc && !desc.startsWith(titolo) ? desc.slice(0, 400) : "",
    };
  }).filter((n) => n.titolo);
}

async function carica(g) {
  ferma();
  gruppo = g;
  document.querySelectorAll(".scelta .btn").forEach((b) => {
    const on = b.dataset.gruppo === g;
    b.classList.toggle("btn-primary", on);
    b.classList.toggle("btn-outline-primary", !on);
    b.setAttribute("aria-pressed", String(on));
  });
  pref.gruppo = g; salva();
  history.replaceState(null, "", `#${g}`);

  $("stato").hidden = false;
  $("stato").textContent = "Caricamento in corso…";
  $("lista").innerHTML = "";
  $("errori").hidden = true;
  $("play").disabled = true;

  const fonti = Object.entries(GRUPPI[g].fonti);
  const ris = await Promise.allSettled(fonti.map(async ([src, nome]) => {
    const r = await fetch(PROXY + src, { cache: "no-store" });
    if (!r.ok) throw new Error(nome);
    return parseFeed(await r.text(), src, nome);
  }));
  if (gruppo !== g) return; // l'utente ha cambiato scelta nel frattempo

  const errori = [];
  const tutte = [];
  ris.forEach((r, i) => (r.status === "fulfilled" ? tutte.push(...r.value) : errori.push(fonti[i][1])));
  const visti = new Set();
  notizie = tutte
    .filter((n) => { const k = n.titolo.toLowerCase(); return visti.has(k) ? false : visti.add(k); })
    .sort((a, b) => b.ts - a.ts)
    .slice(0, MAX_NOTIZIE);

  $("errori").hidden = !errori.length;
  $("errori").textContent = errori.length ? `Non raggiungibili: ${errori.join(", ")}.` : "";
  $("stato").textContent = notizie.length ? "" : "Nessuna notizia disponibile.";
  $("stato").hidden = notizie.length > 0;
  $("play").disabled = !notizie.length;
  indice = 0;
  disegnaLista();
  aggiornaComandi();
}

const fmtHM = new Intl.DateTimeFormat("it-IT", { hour: "2-digit", minute: "2-digit" });
const fmtGiorno = new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "short" });
const quando = (ts) => !ts ? "" :
  new Date(ts).toDateString() === new Date().toDateString() ? fmtHM.format(ts) : fmtGiorno.format(ts);

function disegnaLista() {
  $("lista").innerHTML = "";
  notizie.forEach((n, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "list-group-item list-group-item-action voce";
    b.innerHTML = `<div><span class="fonte"></span><span class="quando"></span></div><div class="titolo"></div>`;
    b.querySelector(".fonte").textContent = n.fonte;
    b.querySelector(".quando").textContent = quando(n.ts);
    b.querySelector(".titolo").textContent = n.titolo;
    b.addEventListener("click", () => { indice = i; leggi(); });
    $("lista").appendChild(b);
  });
  evidenzia();
}

function evidenzia() {
  [...$("lista").children].forEach((el, i) => el.classList.toggle("attiva", stato !== "fermo" && i === indice));
  const n = notizie[indice];
  $("oraLegge").textContent = stato !== "fermo" && n ? `${indice + 1}/${notizie.length} · ${n.fonte}` : "\u00a0";
  const el = $("lista").children[indice];
  if (stato === "legge" && el) el.scrollIntoView({ block: "center", behavior: "smooth" });
}

// ---------- Lettura ----------
// La pausa è "ferma e riparti dalla notizia corrente": speechSynthesis.pause() su Android non è affidabile.
let token = 0;

function testoDa(n) {
  return `${n.fonte}. ${n.titolo}.`;
}

function leggi() {
  if (!notizie.length) return;
  synth.cancel();
  const mio = ++token;
  stato = "legge";
  tieniSchermoAcceso();
  aggiornaComandi();
  evidenzia();

  const u = new SpeechSynthesisUtterance(testoDa(notizie[indice]));
  if (!voceScelta) scegliVoce();
  if (voceScelta) u.voice = voceScelta;
  u.lang = voceScelta?.lang || "it-IT";
  u.rate = VELOCITA;
  u.onend = () => {
    if (mio !== token || stato !== "legge") return;
    if (indice < notizie.length - 1) { indice++; setTimeout(() => mio === token && leggi(), 400); }
    else { ferma(); $("oraLegge").textContent = "Fine delle notizie"; }
  };
  u.onerror = (e) => {
    if (mio !== token || e.error === "interrupted" || e.error === "canceled") return;
    ferma();
    $("oraLegge").textContent = "Errore della sintesi vocale";
  };
  synth.speak(u);
}

function pausa() {
  token++;
  synth.cancel();
  stato = "pausa";
  lasciaSchermo();
  aggiornaComandi();
  evidenzia();
}

function ferma() {
  token++;
  synth.cancel();
  stato = "fermo";
  indice = 0;
  lasciaSchermo();
  aggiornaComandi();
  evidenzia();
}

function aggiornaComandi() {
  $("play").textContent = stato === "legge" ? "Pausa" : stato === "pausa" ? "Riprendi" : "Ascolta";
  $("stop").disabled = stato === "fermo";
  $("prec").disabled = !notizie.length || indice === 0;
  $("succ").disabled = !notizie.length || indice >= notizie.length - 1;
}

$("play").addEventListener("click", () => (stato === "legge" ? pausa() : leggi()));
$("stop").addEventListener("click", ferma);
$("prec").addEventListener("click", () => { if (indice > 0) { indice--; stato === "legge" ? leggi() : (aggiornaComandi(), evidenzia()); } });
$("succ").addEventListener("click", () => { if (indice < notizie.length - 1) { indice++; stato === "legge" ? leggi() : (aggiornaComandi(), evidenzia()); } });

document.querySelectorAll(".scelta .btn").forEach((b) =>
  b.addEventListener("click", () => carica(b.dataset.gruppo)));

// Schermo acceso durante la lettura: con lo schermo spento molti browser interrompono la voce
async function tieniSchermoAcceso() {
  try { if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch {}
}
function lasciaSchermo() { try { wakeLock?.release(); } catch {} wakeLock = null; }
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && stato === "legge") { wakeLock = null; tieniSchermoAcceso(); }
});
window.addEventListener("pagehide", () => synth.cancel());

if (!("speechSynthesis" in window)) {
  $("stato").textContent = "Questo browser non supporta la lettura vocale.";
} else {
  const iniziale = location.hash.slice(1) in GRUPPI ? location.hash.slice(1) : pref.gruppo;
  if (iniziale in GRUPPI) carica(iniziale);
}
aggiornaComandi();
</script>
</body>
</html>
